/* ---------------- 确定性圆盘打包布局 ---------------- */
let nodesPos = nodes;
let layoutMode='force';
const GAP_IN = 34;    // 簇内格距
const GAP_CL = 15;    // 簇间留白
const GAP_AR = 78;    // 分区之间留白

/* 圆盘打包：向日葵初值 + 只分离松弛（确定性，不重叠） */
function packDiscs(items, gap){
  items.sort((a,b)=> b.r-a.r || a.key.localeCompare(b.key));
  const n=items.length;
  if(!n) return 0;
  let avg=0; items.forEach(it=>avg+=it.r); avg/=n;
  const pitch=2*avg+gap;
  // 同心环初值：环半径按 pitch 递增，每环按周长均分角度
  let idx=0, ring=0;
  while(idx<n){
    const R = ring===0? 0 : pitch*ring*0.86;
    const cap = ring===0? 1 : Math.max(4, Math.floor(2*Math.PI*R/pitch));
    for(let k=0;k<cap && idx<n;k++,idx++){
      const ang = ring*0.73 + k*2*Math.PI/cap;
      items[idx].px=Math.cos(ang)*R;
      items[idx].py=Math.sin(ang)*R;
    }
    ring++;
    if(ring>80) break;
  }
  const ITERS = n>50? 60 : n>12? 36 : 16;
  for(let t=0;t<ITERS;t++){
    let moved=false;
    for(let i=0;i<n;i++){
      for(let j=i+1;j<n;j++){
        const a=items[i], b=items[j];
        const dx=b.px-a.px, dy=b.py-a.py;
        const d=Math.hypot(dx,dy)||0.01;
        const need=a.r+b.r+gap;
        if(d<need-0.01){
          const push=Math.min((need-d)*0.52, need*0.6);
          const ux=dx/d, uy=dy/d;
          a.px-=ux*push; a.py-=uy*push;
          b.px+=ux*push; b.py+=uy*push;
          moved=true;
        }
      }
    }
    if(!moved) break;
  }
  let cx=0, cy=0, R=0;
  items.forEach(it=>{ cx+=it.px; cy+=it.py; });
  cx/=n; cy/=n;
  items.forEach(it=>{ it.px-=cx; it.py-=cy; R=Math.max(R, Math.hypot(it.px,it.py)+it.r); });
  return R;
}

/* 目录簇内：网格铺点（保证点与点不重叠），返回簇半径 */
function placeCluster(list){
  const n=list.length;
  if(n===1){ list[0]._x=0; list[0]._y=0; return Math.max(list[0].r,4)+4; }
  const cols=Math.ceil(Math.sqrt(n));
  const rows=Math.ceil(n/cols);
  list.sort((a,b)=> b.deg-a.deg || a.name.localeCompare(b.name));
  let rmax=0;
  list.forEach((nd,i)=>{
    const cx=(i%cols)-(cols-1)/2;
    const cy=Math.floor(i/cols)-(rows-1)/2;
    nd._x=cx*GAP_IN + (cy%2? GAP_IN*0.12:0);
    nd._y=cy*GAP_IN*0.88;
    rmax=Math.max(rmax, Math.hypot(nd._x,nd._y)+nd.r);
  });
  return rmax+7;
}

function buildLayout(mode){
  layoutMode=mode;
  nodesPos = nodes.slice();
  nodesPos.forEach(n=>{
    n.r = Math.min(12.0, 2.7 + Math.sqrt(n.deg)*0.85);
    if(n.isIndex) n.r = Math.max(n.r, 5.5);
  });

  if(mode==='cluster'){
    const areas=[...new Set(nodesPos.map(n=>n.top))];
    const total=nodesPos.length;
    let acc=-Math.PI/2;
    areas.forEach(a=>{
      const list=nodesPos.filter(n=>n.top===a);
      const span=(list.length/Math.max(total,1))*Math.PI*2;
      list.sort((x,y)=> x.dir.localeCompare(y.dir) || x.name.localeCompare(y.name));
      list.forEach((n,i)=>{
        const t=list.length===1?0.5:i/(list.length-1);
        const ang=acc+span*(0.06+0.88*t);
        const rad=240+n.depth*46;
        n.x=Math.cos(ang)*rad; n.y=Math.sin(ang)*rad*0.92;
      });
      acc+=span;
    });
    DATA.clusters = rebuildClusters();
    return;
  }

  /* --- 目录簇布局：目录 -> 簇内网格 -> 分区圆盘 -> 全局圆盘 --- */
  const byArea=new Map();
  nodesPos.forEach(n=>{
    const a=n.top||'(根)';
    if(!byArea.has(a)) byArea.set(a,new Map());
    const m=byArea.get(a);
    if(!m.has(n.dir)) m.set(n.dir,[]);
    m.get(n.dir).push(n);
  });

  // 1) 每个目录簇在局部坐标系铺开
  const clustersByArea=new Map();
  byArea.forEach((dirMap,area)=>{
    const cl=[];
    dirMap.forEach((list,dir)=>{
      const r=placeCluster(list);
      cl.push({dir, n:list.length, r, key:dir, nodes:list});
    });
    clustersByArea.set(area,cl);
  });

  // 2) 分区圆盘：把本区所有簇打包成一个盘
  const areas=[];
  clustersByArea.forEach((cl,area)=>{
    const R=packDiscs(cl, GAP_CL);
    areas.push({area, key:area, r:R, clusters:cl});
  });

  // 3) 全局：分区圆盘再打包
  const globalR=packDiscs(areas, GAP_AR);

  // 4) 回填坐标
  areas.forEach(a=>{
    a.clusters.forEach(c=>{
      c.nodes.forEach(nd=>{
        nd.x = a.px + c.px + nd._x;
        nd.y = a.py + c.py + nd._y;
      });
    });
  });
  DATA.clusters = rebuildClusters();
}

/* 用实际坐标重算簇标注（簇心 / 半径），供 drawClusterLabels 使用 */
function rebuildClusters(){
  const m=new Map();
  nodes.forEach(n=>{
    if(!m.has(n.dir)) m.set(n.dir,[]);
    m.get(n.dir).push(n);
  });
  const out=[];
  m.forEach((list,dir)=>{
    let cx=0,cy=0,r=0;
    list.forEach(n=>{ cx+=n.x; cy+=n.y; });
    cx/=list.length; cy/=list.length;
    list.forEach(n=>{ r=Math.max(r, Math.hypot(n.x-cx,n.y-cy)+n.r); });
    out.push({dir, n:list.length, x:cx, y:cy, r:r+4});
  });
  return out;
}

/* ---------------- 画布 ---------------- */
const cv = $('#cv'), ctx = cv.getContext('2d');
let view={k:1,tx:0,ty:0}, hover=null, sel=null, hubFilter=0;
let W=0,H=0,DPR=1;
function resize(){
  const b = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W=b.width; H=b.height;
  cv.width=W*DPR; cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  draw();
}
function visibleNodes(){
  let arr = nodes;
  if(!showProxy) arr = arr.filter(n=>!isProxy(n));
  if(hubFilter) arr = arr.filter(n=>n.deg>=hubFilter);
  if(focusArea) arr = arr.filter(n=>n.top===focusArea);
  return arr;
}
function visibleEdges(vset){
  return allEdges.filter(e=>typeState[e.type] && vset.has(e.s) && vset.has(e.t));
}
function fitView(){
  const arr=visibleNodes();
  if(!arr.length||!W) return;
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  arr.forEach(n=>{ minX=Math.min(minX,n.x); maxX=Math.max(maxX,n.x);
                   minY=Math.min(minY,n.y); maxY=Math.max(maxY,n.y); });
  const bw=Math.max(maxX-minX,60), bh=Math.max(maxY-minY,60);
  view.k=Math.max(.2, Math.min(1.35, Math.min((W-160)/bw,(H-140)/bh)));
  view.tx=(W-(minX+maxX)*view.k)/2;
  view.ty=(H-(minY+maxY)*view.k)/2;
}

function draw(){
  if(!W) return;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0a0e15'; ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W*0.42,H*0.42,40,W*0.5,H*0.5,Math.max(W,H)*0.72);
  g.addColorStop(0,'#111c2a'); g.addColorStop(1,'#0a0e15');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  const arr = visibleNodes();
  const vset = new Set(arr.map(n=>n.id));
  const edges = visibleEdges(vset);
  const focusId = hover||sel;
  const nb = new Set();
  if(focusId){
    nb.add(focusId);
    edges.forEach(e=>{ if(e.s===focusId) nb.add(e.t); if(e.t===focusId) nb.add(e.s); });
  }

  ctx.save();
  ctx.translate(view.tx,view.ty); ctx.scale(view.k,view.k);

  // 边
  for(const e of edges){
    const a=byId.get(e.s), b=byId.get(e.t);
    if(!a||!b) continue;
    const m=EDGE_META[e.type];
    const active = focusId && (e.s===focusId||e.t===focusId);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
    ctx.strokeStyle = m.color;
    let alpha = active? .95 : (e.type==='sibling'? .12 : e.type==='cross'? .14 :
                  e.type==='index'? .42 : .30);
    if(focusId) alpha = active? .95 : .07;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = (active? 2.1 : (e.type==='index'? .8 : .55))/view.k;
    ctx.setLineDash(m.dash.length? m.dash.map(x=>x/view.k) : []);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // 目录簇：淡色边界 + 目录名（缩放足够时）
  ctx.textAlign='center'; ctx.textBaseline='middle';
  DATA.clusters.forEach(c=>{
    const sx=c.x*view.k+view.tx, sy=c.y*view.k+view.ty;
    const r=c.r*view.k;
    if(sx<-r||sx>W+r||sy<-r||sy>H+r) return;
    const col=AREA_COLOR[(c.dir.split('/')[0])||'(根)']||'#7f93a8';
    if(c.n>=4 && r>26){
      ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
      ctx.strokeStyle=col; ctx.globalAlpha=.10; ctx.lineWidth=1/view.k; ctx.stroke();
    }
  });

  // 节点（小点先画，枢纽后画）
  const ordered = arr.slice().sort((a,b)=>a.deg-b.deg);
  for(const n of ordered){
    const isFocus = focusId===n.id;
    const dim = focusId && !nb.has(n.id);
    const col = AREA_COLOR[n.top]||'#94a3b8';
    ctx.globalAlpha = dim? .34 : 1;
    if(isProxy(n)){
      const d=n.r*1.25;
      ctx.beginPath(); ctx.moveTo(n.x,n.y-d); ctx.lineTo(n.x+d,n.y);
      ctx.lineTo(n.x,n.y+d); ctx.lineTo(n.x-d,n.y); ctx.closePath();
      ctx.strokeStyle=col; ctx.lineWidth=1.1/view.k; ctx.stroke();
      ctx.fillStyle='rgba(15,25,36,.9)'; ctx.fill();
      ctx.globalAlpha = (dim? .34 : 1)*.55; ctx.fillStyle=col; ctx.fill();
      ctx.globalAlpha = dim? .34 : 1;
    } else {
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
      ctx.fillStyle=col; ctx.fill();
      if(n.isIndex){ ctx.strokeStyle='#dfe9f8'; ctx.lineWidth=1.1/view.k; ctx.stroke(); }
    }
    if(isFocus || (focusId && nb.has(n.id))){
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r+4,0,Math.PI*2);
      ctx.strokeStyle = isFocus? '#ffffff' : col;
      ctx.globalAlpha = isFocus? .95 : .4;
      ctx.lineWidth = 1.1/view.k; ctx.stroke();
    }
    if(query && (n.name.toLowerCase().includes(query)||n.id.toLowerCase().includes(query))){
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r+5,0,Math.PI*2);
      ctx.strokeStyle='#ffffff'; ctx.globalAlpha=.9; ctx.lineWidth=1.3/view.k; ctx.stroke();
    }
  }
  ctx.restore();

  drawClusterLabels();
  drawAreaLabels(arr);

  // 标签：屏幕坐标绘制，恒定字号 + 贪心避让
  drawLabels(arr, focusId, nb);
  ctx.globalAlpha=1;
  $('#hud').textContent = `${arr.length} 节点 · ${fmt(edges.length)} 条链接`;
}

function drawClusterLabels(){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  DATA.clusters.forEach(c=>{
    if(!showProxy && c.dir.indexOf(PROXY_TOP)>=0) return;
    const r=c.r*view.k;
    if(r<17 || c.n<3) return;
    if(view.k<0.55 && c.n<8) return;
    const sx=c.x*view.k+view.tx, sy=c.y*view.k+view.ty;
    const ly = sy - r - 9;
    if(sx<-80||sx>W+80||ly<-16||ly>H+16) return;
    const nm=c.dir.split('/').pop();
    const txt=nm.length>14?nm.slice(0,13)+'…':nm;
    const fs = view.k<0.55? 9.5 : 11;
    ctx.font=`${fs}px "Microsoft YaHei",system-ui`;
    const w=ctx.measureText(txt).width;
    const col=AREA_COLOR[(c.dir.split('/')[0])||'(根)']||'#8fa3b8';
    // 胶囊底
    ctx.globalAlpha=1;
    ctx.beginPath();
    const bw=w+13, bh=16, bx=sx-bw/2, by=ly-bh/2, rr=4;
    ctx.moveTo(bx+rr,by); ctx.arcTo(bx+bw,by,bx+bw,by+bh,rr);
    ctx.arcTo(bx+bw,by+bh,bx,by+bh,rr); ctx.arcTo(bx,by+bh,bx,by,rr);
    ctx.arcTo(bx,by,bx+bw,by,rr); ctx.closePath();
    ctx.fillStyle='rgba(22,34,47,.92)'; ctx.fill();
    ctx.strokeStyle=col; ctx.globalAlpha=.55; ctx.lineWidth=1; ctx.stroke();
    ctx.globalAlpha=1; ctx.fillStyle='#dbe7f6';
    ctx.fillText(txt, sx, ly+0.5);
  });
}

function drawAreaLabels(arr){
  const buckets={};
  arr.forEach(n=>{ (buckets[n.top]=buckets[n.top]||[]).push(n); });
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.font='600 11px "Microsoft YaHei",system-ui';
  Object.entries(buckets).forEach(([area,list])=>{
    if(list.length<3) return;
    let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
    list.forEach(n=>{ minX=Math.min(minX,n.x);maxX=Math.max(maxX,n.x);
                      minY=Math.min(minY,n.y);maxY=Math.max(maxY,n.y); });
    const sx=(minX+maxX)/2*view.k+view.tx, sy=minY*view.k+view.ty-16;
    const col=AREA_COLOR[area]||'#94a3b8';
    const label = area==='(根)'? '根目录导航' : area;
    const txt=label;
    ctx.globalAlpha=1; ctx.lineWidth=3.5; ctx.strokeStyle='rgba(10,14,21,.92)';
    ctx.strokeText(txt, sx, sy);
    ctx.globalAlpha=.7; ctx.fillStyle=col; ctx.fillText(txt, sx, sy);
  });
}

function drawLabels(arr, focusId, nb, noBudget){
  const place = [];
  const cands = [];
  for(const n of arr){
    const isFocus = focusId===n.id;
    const isNb = focusId && nb.has(n.id);
    let show = isFocus || isNb;
    if(!show){
      if(labelMode==='all') show = true;
      else if(labelMode==='hub') show = n.deg>=(view.k<0.62? 64 : view.k<0.95? 34 : 12) || (n.isIndex && n.in>=14);
    }
    if(query && (n.name.toLowerCase().includes(query)||n.id.toLowerCase().includes(query))) show=true;
    if(!show) continue;
    cands.push({n, pri: isFocus?0 : n.id===sel?.id?1 : isNb?2 : (n.isIndex?3:4)});
  }
  cands.sort((a,b)=>a.pri-b.pri || b.n.deg-a.n.deg);
  const budget = view.k<0.5? 12 : view.k<0.75? 26 : view.k<1.1? 52 : 140;
  let placed=0;
  ctx.textBaseline='middle'; ctx.textAlign='left';
  for(const {n,pri} of cands){
    const sx=n.x*view.k+view.tx, sy=n.y*view.k+view.ty;
    if(sx<-40||sx>W+40||sy<-20||sy>H+20) continue;
    const dim = focusId && !nb.has(n.id) && n.id!==focusId;
    const label = n.name.length>30? n.name.slice(0,29)+'…' : n.name;
    ctx.font = `${n.isIndex?600:400} ${11.5}px "Microsoft YaHei",system-ui`;
    const w = ctx.measureText(label).width;
    const x = sx + Math.max(6, n.r*view.k+4), y = sy;
    const box = {x:x-3,y:y-7,w:w+7,h:14};
    const hit = place.some(b=> !(box.x>b.x+b.w || box.x+box.w<b.x || box.y>b.y+b.h || box.y+box.h<b.y));
    if(hit && pri>1) continue;           // 焦点与邻接标签强制显示
    if(placed>=budget && pri>1) continue;
    place.push(box); placed++;
    ctx.globalAlpha = dim? .22 : .95;
    ctx.lineWidth = 3; ctx.strokeStyle='rgba(10,14,21,.92)'; ctx.lineJoin='round';
    ctx.strokeText(label, x, y);
    ctx.fillStyle = n.id===focusId? '#ffffff' : (n.isIndex? '#e2ecfa':'#b9c9dc');
    ctx.fillText(label, x, y);
  }
}

/* 交互 */
let drag=null, moved=false;
function toWorld(px,py){ return {x:(px-view.tx)/view.k, y:(py-view.ty)/view.k}; }
function pick(px,py){
  const w=toWorld(px,py);
  let best=null, bd=1e9;
  const arr=visibleNodes();
  arr.forEach(n=>{
    const d=Math.hypot(n.x-w.x,n.y-w.y);
    const tol=Math.max(n.r+6/view.k, 9/view.k);
    if(d<tol && d<bd){bd=d;best=n;}
  });
  return best;
}
cv.addEventListener('mousemove',e=>{
  const b=cv.getBoundingClientRect();
  const px=e.clientX-b.left, py=e.clientY-b.top;
  if(drag){
    const dx=px-drag.px, dy=py-drag.py;
    if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
    view.tx+=dx; view.ty+=dy; drag={px,py}; cv.classList.add('dragging'); draw(); return;
  }
  const n=pick(px,py);
  if(hover!==n){ hover=n; cv.classList.toggle('pointing',!!n); draw(); }
  const tip=$('#tip');
  if(n){
    tip.style.opacity=1;
    tip.style.left=Math.min(px+16, W-350)+'px';
    tip.style.top=Math.min(py+14, H-110)+'px';
    const tags=n.tags.length? n.tags.slice(0,4).join(' · ') : '无标签';
    tip.innerHTML=`<div class="t">${n.name}</div><div class="p">${shortPath(n.path)}</div>
      <div class="m">${n.top+' · 入链 '+n.in+' / 出链 '+n.out}</div>
      <div class="m" style="color:#6f849c">${tags}</div>`;
  } else tip.style.opacity=0;
});
cv.addEventListener('mousedown',e=>{
  const b=cv.getBoundingClientRect(); moved=false;
  drag={px:e.clientX-b.left, py:e.clientY-b.top};
});
window.addEventListener('mouseup',e=>{
  if(drag && !moved){
    const b=cv.getBoundingClientRect();
    const n=pick(e.clientX-b.left, e.clientY-b.top);
    select(n);
  }
  drag=null; cv.classList.remove('dragging');
});
cv.addEventListener('mouseleave',()=>{hover=null; $('#tip').style.opacity=0; draw();});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const b=cv.getBoundingClientRect(), px=e.clientX-b.left, py=e.clientY-b.top;
  const k2=Math.min(5, Math.max(.18, view.k*(e.deltaY<0?1.12:.89)));
  view.tx = px-(px-view.tx)*(k2/view.k);
  view.ty = py-(py-view.ty)*(k2/view.k);
  view.k=k2; draw();
},{passive:false});

/* ---------------- 思维导图 ---------------- */
const svg=$('#msvg'), mroot=$('#mroot');
let mindState={}, mindTf={k:1,x:60,y:60}, currentView='graph', collapsed=new Set();
const ROW=21, COL=238;

function buildMindTree(){
  const t=DATA.tree;
  function norm(node, depth, parentPath){
    const o={name:node.name, kind:node.type, path:node.path, count:node.count||0,
      id:node.id, depth, area:null, children:[], tags:node.tags||[], deg:node.deg||0, isIndex:node.isIndex};
    if(node.type==='dir'){
      o.children=(node.children||[]).map(c=>norm(c, depth+1, node.path));
    }
    return o;
  }
  const root=norm(t,0,'');
  // 计算每个节点的分区
  root.area='(根)';
  (function walk(n, area){
    n.children.forEach(c=>{
      const a = n.depth===0 ? c.name : area;
      c.area = n.depth===0 ? (c.name==='README.md'?'(根)':c.name) : area;
      walk(c, c.area);
    });
  })(root, '(根)');
  return root;
}
const MROOT = buildMindTree();

function defaultFold(){
  collapsed=new Set();
  (function walk(n){
    n.children.forEach(c=>{
      if(c.kind==='dir' && (c.depth>=2 || c.name.indexOf('06-')===0)) collapsed.add(c.path);
      walk(c);
    });
  })(MROOT);
}
defaultFold();

function mindVisible(){
  const rows=[];
  function walk(n){
    rows.push(n);
    if(n.kind==='dir' && !collapsed.has(n.path)) n.children.forEach(walk);
  }
  walk(MROOT);
  return rows;
}
function layoutMind(){
  let cur=0;
  const rows=mindVisible();
  function place(n){
    const kids = (n.kind==='dir' && !collapsed.has(n.path))? n.children : [];
    if(!kids.length){ n.y=cur*ROW; cur++; }
    else { kids.forEach(place); n.y=(kids[0].y+kids[kids.length-1].y)/2; }
    n.x = n.depth*COL;
  }
  place(MROOT);
  // 同列强制最小行距，避免同名文件与同名目录重叠
  const byDepth={};
  rows.forEach(n=>{ (byDepth[n.depth]=byDepth[n.depth]||[]).push(n); });
  Object.values(byDepth).forEach(list=>{
    list.sort((a,b)=>a.y-b.y);
    for(let i=1;i<list.length;i++){
      if(list[i].y-list[i-1].y < ROW) list[i].y=list[i-1].y+ROW;
    }
  });
  let maxY=0; rows.forEach(n=>{ maxY=Math.max(maxY,n.y); });
  return {rows, height:Math.max(maxY+ROW, ROW)};
}
function renderMind(){
  const {rows, height}=layoutMind();
  const NS='http://www.w3.org/2000/svg';
  while(mroot.firstChild) mroot.removeChild(mroot.firstChild);
  // 连线
  rows.forEach(n=>{
    if(n.kind!=='dir'||collapsed.has(n.path)) return;
    n.children.forEach(c=>{
      const p=document.createElementNS(NS,'path');
      const mid=(n.x+34+c.x-10)/2;
      p.setAttribute('d',`M${n.x+8},${n.y} C${mid},${n.y} ${mid},${c.y} ${c.x-10},${c.y}`);
      p.setAttribute('fill','none');
      p.setAttribute('stroke', c.kind==='dir'?'#243447':(AREA_COLOR[c.area]||'#3b4d63'));
      p.setAttribute('stroke-opacity', c.kind==='dir'?'.9':'.38');
      p.setAttribute('stroke-width','1');
      p.setAttribute('data-link','1');
      mroot.appendChild(p);
    });
  });
  // 节点
  rows.forEach(n=>{
    const g=document.createElementNS(NS,'g');
    g.setAttribute('class','m-node');
    const col=AREA_COLOR[n.area]||'#94a3b8';
    if(n.kind==='dir'){
      const r=document.createElementNS(NS,'rect');
      r.setAttribute('x',n.x-9); r.setAttribute('y',n.y-7);
      r.setAttribute('width','18'); r.setAttribute('height','14'); r.setAttribute('rx','4');
      r.setAttribute('fill', collapsed.has(n.path)? '#131f2d':'#182a3f');
      r.setAttribute('stroke', col); r.setAttribute('stroke-opacity','.55');
      g.appendChild(r);
      const t=document.createElementNS(NS,'text');
      t.setAttribute('x',n.x+16); t.setAttribute('y',n.y);
      t.setAttribute('class','m-lbl dir');
      const dn=n.name.length>19? n.name.slice(0,18)+'…' : n.name;
      t.textContent=(collapsed.has(n.path)?'▸ ':'▾ ')+dn;
      const tip=document.createElementNS(NS,'title'); tip.textContent=n.path; t.appendChild(tip);
      g.appendChild(t);
      const c=document.createElementNS(NS,'text');
      c.setAttribute('x',n.x+17+Math.min(n.name.length,19)*11.4); c.setAttribute('y',n.y+1);
      c.setAttribute('class','m-cnt'); c.textContent=n.count? '· '+n.count:'';
      g.appendChild(c);
    } else {
      const circle=document.createElementNS(NS,'circle');
      const rr=Math.min(6.5, 2.6+Math.sqrt(n.deg)*.75);
      circle.setAttribute('cx',n.x); circle.setAttribute('cy',n.y); circle.setAttribute('r',rr);
      circle.setAttribute('fill', n.isIndex?'#0d1520':col);
      circle.setAttribute('stroke', n.isIndex? col : 'none');
      circle.setAttribute('stroke-width', n.isIndex?'1.6':'0');
      g.appendChild(circle);
      const t=document.createElementNS(NS,'text');
      t.setAttribute('x',n.x+11); t.setAttribute('y',n.y+0.5);
      t.setAttribute('class','m-lbl');
      t.setAttribute('fill', n.isIndex? '#dbe7f7':'#a9bacd');
      if(n.isIndex) t.setAttribute('font-weight','600');
      const nm=n.name.length>30? n.name.slice(0,29)+'…' : n.name;
      t.textContent=nm;
      const tip2=document.createElementNS(NS,'title'); tip2.textContent=n.path; t.appendChild(tip2);
      g.appendChild(t);
      if(sel && sel.id===n.id){
        const h=document.createElementNS(NS,'circle');
        h.setAttribute('cx',n.x); h.setAttribute('cy',n.y); h.setAttribute('r',rr+4);
        h.setAttribute('fill','none'); h.setAttribute('stroke','#fff'); h.setAttribute('stroke-width','1.4');
        g.appendChild(h);
      }
    }
    if(n.kind==='dir' && n.children.length) g.style.cursor='pointer';
    g.addEventListener('click',ev=>{
      ev.stopPropagation();
      if(n.kind==='dir'){
        if(collapsed.has(n.path)) collapsed.delete(n.path); else collapsed.add(n.path);
        renderMind();
      } else {
        const note = noteById.get(n.path);
        if(note) select(note);
      }
    });
    const title=document.createElementNS(NS,'title');
    title.textContent = n.kind==='dir'? `${n.name}（${n.count} 篇）` : `${n.path}`;
    g.appendChild(title);
    mroot.appendChild(g);
  });
  mroot.setAttribute('transform',`translate(${mindTf.x},${mindTf.y}) scale(${mindTf.k})`);
  if(sel) drawRelArcs(sel);
  $('#mlegend').innerHTML = Object.entries(AREA_COLOR).map(([k,v])=>
    `<span><i class="dot" style="background:${v}"></i>${k==='(根)'?'根目录':k}</span>`).join('')+
    `<span style="color:#5f748c">○ 索引页 · 圆点=连接度 · 数字=目录内笔记数</span>
     <span style="color:#a78bfa">弧线＝选中笔记的引用关系（颜色对应链接类型）</span>`;
}
function drawRelArcs(n){
  mroot.querySelectorAll('[data-rel]').forEach(e=>e.remove());
  if(!n) return;
  const rows=mindVisible();
  const pos=new Map();
  rows.forEach(r=>{ if(r.kind==='note') pos.set(r.path,r); });
  const src=pos.get(n.id); if(!src) return;
  (adjAll.get(n.id)||[]).forEach(e=>{
    const otherId = e.s===n.id? e.t : e.s;
    const o=pos.get(otherId); if(!o) return;
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    const mx=(src.x+o.x)/2, my=(src.y+o.y)/2 - Math.min(160, Math.abs(o.y-src.y)*.42+20);
    p.setAttribute('d',`M${src.x+4},${src.y} Q${mx},${my} ${o.x+4},${o.y}`);
    p.setAttribute('fill','none');
    p.setAttribute('stroke', EDGE_META[e.type].color);
    p.setAttribute('stroke-opacity','.55'); p.setAttribute('stroke-width','1.1');
    if(EDGE_META[e.type].dash.length) p.setAttribute('stroke-dasharray','4 4');
    p.setAttribute('data-rel','1');
    mroot.insertBefore(p, mroot.firstChild);
  });
}
function revealInMind(n){
  // 展开所有祖先目录
  const parts=n.id.split('/');
  let p='';
  for(let i=0;i<parts.length-1;i++){
    p = p? p+'/'+parts[i] : parts[i];
    collapsed.delete(p);
  }
  renderMind();
  const rows=mindVisible().find(r=>r.path===n.id);
  if(rows){
    const wrap=$('#mindwrap').getBoundingClientRect();
    mindTf.x = wrap.width*0.42 - rows.x*mindTf.k;
    mindTf.y = wrap.height*0.45 - rows.y*mindTf.k;
    mroot.setAttribute('transform',`translate(${mindTf.x},${mindTf.y}) scale(${mindTf.k})`);
  }
}
function mindFit(){
  const rows=mindVisible();
  if(!rows.length) return;
  const maxX=Math.max(...rows.map(r=>r.x+ (r.kind==='dir'? 220+r.name.length*12 : r.name.length*7+30)));
  const minY=Math.min(...rows.map(r=>r.y)), maxY=Math.max(...rows.map(r=>r.y));
  const wrap=$('#mindwrap').getBoundingClientRect();
  const k=Math.min(1.45, Math.min((wrap.width-90)/maxX, (wrap.height-120)/(maxY-minY+40)));
  mindTf.k=Math.max(.42,k);
  const contentW=maxX* mindTf.k;
  mindTf.x=Math.max(40,(wrap.width-contentW)/2);
  mindTf.y=70-minY*mindTf.k;
  mroot.setAttribute('transform',`translate(${mindTf.x},${mindTf.y}) scale(${mindTf.k})`);
}

$('#mindwrap').addEventListener('wheel',e=>{
  e.preventDefault();
  const r=$('#mindwrap').getBoundingClientRect();
  const px=e.clientX-r.left, py=e.clientY-r.top;
  const k2=Math.min(2.2,Math.max(.18,mindTf.k*(e.deltaY<0?1.1:.91)));
  mindTf.x=px-(px-mindTf.x)*(k2/mindTf.k);
  mindTf.y=py-(py-mindTf.y)*(k2/mindTf.k);
  mindTf.k=k2;
  mroot.setAttribute('transform',`translate(${mindTf.x},${mindTf.y}) scale(${mindTf.k})`);
},{passive:false});

document.querySelectorAll('[data-exp]').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('[data-exp]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const lv=+b.dataset.exp;
    collapsed=new Set();
    (function walk(n){
      n.children.forEach(c=>{ if(c.kind==='dir' && c.depth>=lv) collapsed.add(c.path); walk(c); });
    })(MROOT);
    renderMind(); mindFit();
  };
});
$('#mfit').onclick=mindFit;
$('#mrel').onclick=()=>{
  if(!sel){ alert('先点击一篇笔记'); return; }
  const ids=new Set();
  (adjAll.get(sel.id)||[]).forEach(e=>ids.add(e.s===sel.id? e.t : e.s));
  ids.forEach(id=>{
    const parts=id.split('/'); let p='';
    for(let i=0;i<parts.length-1;i++){ p=p? p+'/'+parts[i] : parts[i]; collapsed.delete(p); }
  });
  renderMind(); revealInMind(sel);
};
$('#mfold').onclick=()=>{
  collapsed=new Set();
  MROOT.children.forEach(c=>{ if(c.kind==='dir') collapsed.add(c.path); });
  renderMind(); mindFit();
};

/* ---------------- 视图切换 ---------------- */
function switchView(v){
  currentView=v;
  $('#tab-graph').classList.toggle('active',v==='graph');
  $('#tab-mind').classList.toggle('active',v==='mind');
  $('#view-graph').classList.toggle('active',v==='graph');
  $('#view-mind').classList.toggle('active',v==='mind');
  $('#side-graph').style.display = v==='graph'?'block':'none';
  if(v==='graph'){ resize(); }
  else { renderMind(); setTimeout(mindFit,30); }
}
$('#tab-graph').onclick=()=>switchView('graph');
$('#tab-mind').onclick=()=>switchView('mind');

/* ---------------- 启动 ---------------- */
buildLayout('force');
select(null);
resize();
fitView(); draw();
window.addEventListener('resize',()=>{ if(currentView==='graph') resize(); });
</script>
