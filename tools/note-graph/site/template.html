<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PowerSystem · 笔记架构图谱</title>
<style>
  :root{
    --bg:#0a0e15; --panel:#111823; --panel-2:#0e141d; --line:#1e2a3a; --line-2:#2a3a4f;
    --tx:#e6edf7; --tx-2:#9fb2c8; --tx-3:#64788f;
    --blue:#4f8cff; --amber:#f2a541; --violet:#a78bfa; --cyan:#38bdf8; --slate:#94a3b8;
    --pink:#e879a6; --dim:#33475e;
    --mono:ui-monospace,"SF Mono",Consolas,"Cascadia Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#22303f;border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}

  .topbar{height:60px;display:flex;align-items:center;gap:22px;padding:0 20px;
    background:linear-gradient(180deg,#101825,#0b1119);border-bottom:1px solid var(--line);position:relative;z-index:20}
  .brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
  .brand b{font-size:15px;letter-spacing:.5px}
  .brand span{font-size:11px;color:var(--tx-3);letter-spacing:1px}
  .tabs{display:flex;gap:4px;background:#0b1119;border:1px solid var(--line);padding:3px;border-radius:9px}
  .tabs button{border:0;background:transparent;color:var(--tx-2);font-size:12.5px;padding:6px 15px;border-radius:7px;cursor:pointer;transition:.15s}
  .tabs button:hover{color:var(--tx)}
  .tabs button.active{background:#1b2a3d;color:#fff;box-shadow:inset 0 0 0 1px #2c4058}
  .stats{margin-left:auto;display:flex;gap:16px;font-size:11px;color:var(--tx-3);white-space:nowrap}
  .stats i{font-style:normal;color:var(--tx);font-family:var(--mono);font-size:12.5px;margin-right:3px}

  main{display:flex;height:calc(100vh - 60px);overflow:hidden}
  .side{width:242px;flex:0 0 242px;background:var(--panel);border-right:1px solid var(--line);
    overflow-y:auto;padding:14px 14px 26px}
  .side h3{font-size:11px;color:var(--tx-3);font-weight:600;letter-spacing:1.2px;margin:18px 0 9px;
    text-transform:uppercase}
  .side h3:first-child{margin-top:2px}
  .search{width:100%;background:#0b1119;border:1px solid var(--line);color:var(--tx);
    border-radius:8px;padding:8px 10px;font-size:12px;outline:none}
  .search:focus{border-color:#33507a}
  .search::placeholder{color:#4d6076}
  .presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .presets button,.mini{background:#0b1119;border:1px solid var(--line);color:var(--tx-2);
    font-size:11.5px;padding:6px 8px;border-radius:7px;cursor:pointer;transition:.15s;text-align:center}
  .presets button:hover,.mini:hover{border-color:#33507a;color:var(--tx)}
  .presets button.on{border-color:#3a5c8a;background:#16233a;color:#cfe0ff}

  .legend-row{display:flex;align-items:center;gap:9px;padding:5px 4px;border-radius:6px;cursor:pointer;
    font-size:12px;color:var(--tx-2);transition:.12s;user-select:none}
  .legend-row:hover{background:#151f2c}
  .legend-row.off{opacity:.34}
  .legend-row .nm{flex:1}
  .legend-row .ct{font-family:var(--mono);font-size:10.5px;color:var(--tx-3)}
  .swatch{width:16px;height:0;border-top-width:2px;border-top-style:solid;flex:0 0 16px;border-radius:1px}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
  .sq{width:8px;height:8px;flex:0 0 8px;border-radius:1px;background:transparent;border:1.5px solid var(--slate)}

  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 2px;
    font-size:12px;color:var(--tx-2)}
  .switch{position:relative;width:30px;height:16px;background:#1b2735;border-radius:9px;cursor:pointer;
    border:1px solid var(--line-2);transition:.15s;flex:0 0 30px}
  .switch::after{content:"";position:absolute;top:1.5px;left:2px;width:11px;height:11px;border-radius:50%;
    background:#6b8099;transition:.15s}
  .switch.on{background:#1d3a63;border-color:#2f5c96}
  .switch.on::after{left:15px;background:#6fa6ff}

  .note-box{font-size:11px;line-height:1.7;color:var(--tx-3);border-left:2px solid #24374d;
    padding:2px 0 2px 9px;margin-top:8px}
  .note-box b{color:var(--tx-2);font-weight:600}

  .view{flex:1;position:relative;overflow:hidden;display:none}
  .view.active{display:block}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas.dragging{cursor:grabbing}
  canvas.pointing{cursor:pointer}

  .hud{position:absolute;right:14px;top:12px;font-family:var(--mono);font-size:10.5px;color:#6d8299;
    background:rgba(11,17,25,.8);padding:5px 10px;border-radius:6px;border:1px solid #1b2836;pointer-events:none}
  .overlay-hint{position:absolute;left:16px;bottom:14px;font-size:11px;color:#5a6f88;
    background:rgba(10,14,21,.72);padding:7px 11px;border-radius:7px;border:1px solid #1b2836;
    backdrop-filter:blur(4px);line-height:1.6;pointer-events:none}
  .overlay-hint em{font-style:normal;color:#93a8c0}

  .tip{position:absolute;pointer-events:none;background:#0d1520ee;border:1px solid #2b3f57;
    border-radius:8px;padding:8px 11px;font-size:11.5px;line-height:1.55;max-width:330px;
    box-shadow:0 8px 24px #0008;opacity:0;transition:opacity .1s;z-index:9;backdrop-filter:blur(4px)}
  .tip .t{color:#fff;font-weight:600;margin-bottom:3px;font-size:12px}
  .tip .p{color:#6f849c;font-family:var(--mono);font-size:10px;word-break:break-all}
  .tip .m{color:#9fb2c8;margin-top:4px}

  .detail{width:308px;flex:0 0 308px;background:var(--panel);border-left:1px solid var(--line);
    overflow-y:auto;padding:16px 16px 30px}
  .detail .empty{font-size:12px;color:var(--tx-3);line-height:1.85}
  .detail .empty b{color:var(--tx-2);display:block;margin-bottom:6px;font-size:12px}
  .d-title{font-size:14px;font-weight:700;line-height:1.45;margin:0 0 6px;word-break:break-word}
  .d-path{font-family:var(--mono);font-size:10px;color:#61758c;word-break:break-all;line-height:1.5}
  .badges{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 14px}
  .badge{font-size:10.5px;padding:2px 7px;border-radius:5px;border:1px solid #263a4f;color:#9fb2c8;
    background:#0d141d;font-family:var(--mono)}
  .badge.tg{border-color:#2c4058;color:#8fa6bf}
  .kv{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px dashed #1a2634}
  .kv span{color:var(--tx-3)}
  .kv b{font-family:var(--mono);font-weight:600;color:#cfe0f5}
  .grp{margin-top:16px}
  .grp h4{font-size:10.5px;letter-spacing:1px;color:#6d8299;margin:0 0 7px;
    display:flex;align-items:center;gap:7px;font-weight:600}
  .grp h4 .ln{flex:1;height:1px;background:#1a2634}
  .lnk{display:block;width:100%;text-align:left;background:transparent;border:0;border-left:2px solid #22303f;
    color:#b9c9dc;font-size:11.5px;line-height:1.5;padding:5px 0 5px 9px;margin-bottom:3px;cursor:pointer;
    border-radius:0 4px 4px 0;transition:.12s}
  .lnk:hover{background:#16202d;color:#fff}
  .lnk .tp{font-size:9.5px;color:#6b7f95;font-family:var(--mono);margin-left:6px}

  /* mind */
  #mindwrap{position:absolute;inset:0;overflow:hidden;cursor:grab}
  #mindwrap.dragging{cursor:grabbing}
  #msvg{width:100%;height:100%;display:block}
  .m-node{cursor:pointer}
  .m-lbl{font-size:11px;fill:#c5d3e3;pointer-events:none;dominant-baseline:middle}
  .m-lbl.dir{font-weight:700;fill:#e6edf7}
  .m-cnt{font-family:var(--mono);font-size:9px;fill:#5f748c;dominant-baseline:middle;pointer-events:none}
  .m-hit{fill:transparent}
  .mindbar{position:absolute;left:14px;top:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:8;
    background:rgba(11,17,25,.86);padding:6px;border-radius:9px;border:1px solid #1b2836;backdrop-filter:blur(6px)}
  .mindbar button{background:#0f1824;border:1px solid #223142;color:#a9bbd0;font-size:11px;
    padding:5px 10px;border-radius:6px;cursor:pointer;transition:.12s}
  .mindbar button:hover{color:#fff;border-color:#3a5c8a}
  .mindlegend{position:absolute;left:14px;bottom:12px;display:flex;gap:13px;flex-wrap:wrap;
    font-size:10.5px;color:#7b8fa6;background:rgba(11,17,25,.86);padding:7px 11px;border-radius:8px;
    border:1px solid #1b2836;backdrop-filter:blur(6px);max-width:calc(100% - 28px)}
  .mindlegend span{display:flex;align-items:center;gap:5px}

  .tbl{width:100%;border-collapse:collapse;font-size:10.5px;margin-top:4px}
  .tbl td{padding:3px 4px;color:#8ea4bb}
  .tbl td:last-child{text-align:right;font-family:var(--mono);color:#c3d3e5}
  .bar{height:3px;background:#16222f;border-radius:2px;overflow:hidden;margin-top:2px}
  .bar i{display:block;height:100%;background:#3a6db5}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><b>PowerSystem 笔记架构</b><span>OBSIDIAN VAULT · 2026-10-17</span></div>
  <nav class="tabs">
    <button id="tab-graph" class="active">链接图</button>
    <button id="tab-mind">思维导图</button>
  </nav>
  <div class="stats">
    <div><i id="s-notes">271</i>篇笔记</div>
    <div><i id="s-edges">—</i>条双链</div>
    <div><i id="s-tags">202</i>个标签</div>
    <div><i id="s-areas">6</i>个分区</div>
  </div>
</header>

<main>
  <aside class="side" id="side-graph">
    <h3>检索</h3>
    <input class="search" id="q" placeholder="搜索笔记名 / 目录…">
    <h3>视图预设</h3>
    <div class="presets">
      <button data-preset="simple" class="on">简洁视图</button>
      <button data-preset="all">全量关系</button>
      <button data-preset="skeleton">导航骨架</button>
      <button data-preset="cross">跨域引用</button>
      <button data-preset="hub">枢纽节点</button>
    </div>

    <h3>链接类型</h3>
    <div id="type-list"></div>

    <h3>节点与标签</h3>
    <div class="row"><span>代码导航代理页</span><div class="switch on" id="sw-proxy"></div></div>
    <div class="row"><span>标签显示</span>
      <select id="lblmode" style="background:#0b1119;border:1px solid #1e2a3a;color:#9fb2c8;border-radius:6px;font-size:11px;padding:3px 6px">
        <option value="hub">仅枢纽</option><option value="all">全部</option><option value="none">隐藏</option>
      </select>
    </div>
    <div class="row"><span>布局方式</span>
      <select id="layoutmode" style="background:#0b1119;border:1px solid #1e2a3a;color:#9fb2c8;border-radius:6px;font-size:11px;padding:3px 6px">
        <option value="force">目录簇布局</option><option value="cluster">分组环形</option>
      </select>
    </div>
    <button class="mini" id="relayout" style="width:100%;margin-top:8px">复位视图</button>

    <h3>分区节点</h3>
    <div id="area-list"></div>

    <div class="note-box">
      <b>口径</b>：Vault 根为 <code>notes/</code>，代码与产物不参与统计；
      双链去重后计 <b id="scope-edges">—</b> 条，失效链接 <b id="scope-broken">—</b> 条。
    </div>
  </aside>

  <section class="view active" id="view-graph">
    <canvas id="cv"></canvas>
    <div class="tip" id="tip"></div>
    <div class="hud" id="hud"></div>
    <div class="overlay-hint">滚轮缩放 · 拖拽平移 · 点击节点查看双向链接明细 · <em>悬停高亮邻接关系</em><br>
<span style="color:#7f93a8">● 笔记　○ 索引页　◇ 代码导航代理页　· 点径 = 连接度　· 虚线圈 = 目录簇</span></div>
  </section>

  <section class="view" id="view-mind">
    <div id="mindwrap"><svg id="msvg"><g id="mroot"></g></svg></div>
    <div class="mindbar">
      <button data-exp="1">一级</button>
      <button data-exp="2" class="on">二级</button>
      <button data-exp="3">三级</button>
      <button data-exp="99">全部展开</button>
      <button id="mfit">适配窗口</button>
      <button id="mrel">展开关联</button>
      <button id="mfold">全部折叠</button>
    </div>
    <div class="mindlegend" id="mlegend"></div>
  </section>

  <aside class="detail" id="detail"></aside>
</main>

<script>
const DATA = __DATA__;
const EDGE_META = {
  index:   {label:'索引导航', color:'#4f8cff', dash:[],    desc:'索引页 → 下属笔记'},
  backref: {label:'索引回链', color:'#7fb0ff', dash:[5,4],  desc:'正文 → 索引页'},
  sibling: {label:'同目录引用', color:'#46586d', dash:[],  desc:'同一文件夹内互引'},
  cross:   {label:'跨目录引用', color:'#a78bfa', dash:[],  desc:'跨文件夹 / 跨分区引用'},
  govern:  {label:'规范约束', color:'#f2a541', dash:[3,3], desc:'引用工程规范或平台手册条款'},
  anchor:  {label:'章节锚点', color:'#e879a6', dash:[2,3], desc:'带 #标题 的精确引用'},
};
function mixHex(hex, ratio){
  const h=hex.replace('#',''); const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  const m=v=>Math.round(v+(255-v)*ratio);
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}
const AREA_COLOR = {'01-项目调研规划与开发建设记录':'#4f8cff','02-工程规范边界与验收治理':'#f2a541',
                    '03-平台使用运维与二次开发手册':'#38bdf8','04-系统部署发布备份与变更记录':'#a78bfa',
                    '05-设备知识设计素材与历史归档资产':'#94a3b8','06-代码工作区导航与链接映射':'#34d399',
                    '(根)':'#cbd5e1'};

/* 链接以 [源下标, 目标下标, 类型下标] 压缩存储；此处一次性还原为对象形式，
   后续渲染逻辑无需感知压缩格式。 */
const LINK_TYPES = DATA.stats.linkTypes.map(pair=>pair[0]);
DATA.nodes.forEach(n=>{ n.id = n.path; });
const nodes = DATA.nodes.map(n => Object.assign({}, n));
const noteById = new Map(nodes.map(n=>[n.id,n]));
const byId = new Map(nodes.map(n=>[n.id,n]));

// 邻接
const adjOut = new Map(), adjIn = new Map(), adjAll = new Map();
nodes.forEach(n=>{adjOut.set(n.id,[]);adjIn.set(n.id,[]);adjAll.set(n.id,[])});
const allEdges = DATA.edges.map(([s,t,ty])=>({s:nodes[s].id, t:nodes[t].id, type:LINK_TYPES[ty]}));
allEdges.forEach(e=>{
  if(!byId.has(e.s)||!byId.has(e.t)) return;
  adjOut.get(e.s).push(e); adjIn.get(e.t).push(e);
  adjAll.get(e.s).push(e); adjAll.get(e.t).push(e);
});

/* ---------------- 通用 ---------------- */
const $ = s=>document.querySelector(s);
const fmt = n=>n.toLocaleString('en-US');
$('#s-notes').textContent = DATA.stats.notes;
$('#s-edges').textContent = fmt(DATA.stats.edges);
$('#s-tags').textContent = DATA.stats.tags;
$('#s-areas').textContent = DATA.stats.topCounts.filter(t=>t[0]!=='(根)').length;
$('#scope-edges').textContent = fmt(DATA.stats.edges);
$('#scope-broken').textContent = DATA.stats.broken;

function shortPath(p){ return p.replace(/^内容\//,'').replace(/\.md$/,''); }

/* ---------------- 左栏 ---------------- */
const typeState = {};
const typeCounts = {};
DATA.stats.linkTypes.forEach(([k,v])=>typeCounts[k]=v);
const typeOrder = ['index','backref','sibling','cross','govern','anchor'];
const tl = $('#type-list');
typeOrder.forEach(k=>{
  typeState[k]=(k!=='sibling'&&k!=='anchor');   // 默认简洁视图：隐藏同目录引用与章节锚点
  const m = EDGE_META[k];
  const d = document.createElement('div');
  d.className='legend-row'+(typeState[k]?'':' off'); d.dataset.type=k;
  d.title = m.desc;
  d.innerHTML = `<span class="swatch" style="border-top-color:${m.color};${m.dash.length?'border-top-style:dashed':''}"></span>
    <span class="nm">${m.label}</span><span class="ct">${fmt(typeCounts[k]||0)}</span>`;
  d.onclick = ()=>{ typeState[k]=!typeState[k]; d.classList.toggle('off',!typeState[k]); draw(); };
  tl.appendChild(d);
});

const areaCount = {};
nodes.forEach(n=>areaCount[n.top]=(areaCount[n.top]||0)+1);
const al = $('#area-list');
DATA.stats.topCounts.forEach(([k,v])=>{
  const d=document.createElement('div');
  d.className='legend-row';
  d.innerHTML=`<span class="dot" style="background:${AREA_COLOR[k]||'#94a3b8'}"></span>
    <span class="nm">${k==='(根)'?'根目录':k}</span><span class="ct">${v}</span>`;
  d.onclick=()=>{ focusArea = focusArea===k?null:k; draw(); };
  d.dataset.area=k;
  al.appendChild(d);
});

let showProxy=true, labelMode='hub', focusArea=null, query='';
const PROXY_TOP='06-代码工作区导航与链接映射';
const isProxy=n=>n.top===PROXY_TOP && !n.isIndex;
$('#sw-proxy').onclick=function(){ showProxy=!showProxy; this.classList.toggle('on',showProxy); draw(); };
$('#lblmode').onchange=e=>{labelMode=e.target.value; draw();};
$('#layoutmode').onchange=e=>{ buildLayout(e.target.value); fitView(); draw(); };
$('#relayout').onclick=()=>{ fitView(); draw(); };
$('#q').oninput=e=>{query=e.target.value.trim().toLowerCase(); draw();};

document.querySelectorAll('[data-preset]').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('[data-preset]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const p=b.dataset.preset;
    const on = p==='all'?['index','backref','sibling','cross','govern','anchor']
      : p==='simple'?['index','backref','cross','govern']
      : p==='skeleton'?['index','backref','govern']
      : p==='cross'?['cross','govern']
      : ['index','backref','sibling','cross','govern','anchor'];
    typeOrder.forEach(k=>{typeState[k]=on.includes(k);
      document.querySelector(`[data-type="${k}"]`).classList.toggle('off',!typeState[k]);});
    hubFilter = p==='hub'?10:0;
    draw();
  };
});

/* ---------------- 确定性圆盘打包布局 ---------------- */
let nodesPos = nodes;
let layoutMode='force';
const GAP_IN = 34;    // 簇内格距
const GAP_CL = 15;    // 簇间留白
const GAP_AR = 78;    // 分区之间留白

/* 圆盘打包：向日葵初值 + 只分离松弛（确定性，不重叠） */
function packDiscs(items, gap){
  items.sort((a,b)=> b.r-a.r || a.key.localeCompare(b.key));
  const n=items.length;
  if(!n) return 0;
  let avg=0; items.forEach(it=>avg+=it.r); avg/=n;
  const pitch=2*avg+gap;
  // 同心环初值：环半径按 pitch 递增，每环按周长均分角度
  let idx=0, ring=0;
  while(idx<n){
    const R = ring===0? 0 : pitch*ring*0.86;
    const cap = ring===0? 1 : Math.max(4, Math.floor(2*Math.PI*R/pitch));
    for(let k=0;k<cap && idx<n;k++,idx++){
      const ang = ring*0.73 + k*2*Math.PI/cap;
      items[idx].px=Math.cos(ang)*R;
      items[idx].py=Math.sin(ang)*R;
    }
    ring++;
    if(ring>80) break;
  }
  const ITERS = n>50? 60 : n>12? 36 : 16;
  for(let t=0;t<ITERS;t++){
    let moved=false;
    for(let i=0;i<n;i++){
      for(let j=i+1;j<n;j++){
        const a=items[i], b=items[j];
        const dx=b.px-a.px, dy=b.py-a.py;
        const d=Math.hypot(dx,dy)||0.01;
        const need=a.r+b.r+gap;
        if(d<need-0.01){
          const push=Math.min((need-d)*0.52, need*0.6);
          const ux=dx/d, uy=dy/d;
          a.px-=ux*push; a.py-=uy*push;
          b.px+=ux*push; b.py+=uy*push;
          moved=true;
        }
      }
    }
    if(!moved) break;
  }
  let cx=0, cy=0, R=0;
  items.forEach(it=>{ cx+=it.px; cy+=it.py; });
  cx/=n; cy/=n;
  items.forEach(it=>{ it.px-=cx; it.py-=cy; R=Math.max(R, Math.hypot(it.px,it.py)+it.r); });
  return R;
}

/* 目录簇内：网格铺点（保证点与点不重叠），返回簇半径 */
function placeCluster(list){
  const n=list.length;
  if(n===1){ list[0]._x=0; list[0]._y=0; return Math.max(list[0].r,4)+4; }
  const cols=Math.ceil(Math.sqrt(n));
  const rows=Math.ceil(n/cols);
  list.sort((a,b)=> b.deg-a.deg || a.name.localeCompare(b.name));
  let rmax=0;
  list.forEach((nd,i)=>{
    const cx=(i%cols)-(cols-1)/2;
    const cy=Math.floor(i/cols)-(rows-1)/2;
    nd._x=cx*GAP_IN + (cy%2? GAP_IN*0.12:0);
    nd._y=cy*GAP_IN*0.88;
    rmax=Math.max(rmax, Math.hypot(nd._x,nd._y)+nd.r);
  });
  return rmax+7;
}

function buildLayout(mode){
  layoutMode=mode;
  nodesPos = nodes.slice();
  nodesPos.forEach(n=>{
    n.r = Math.min(12.0, 2.7 + Math.sqrt(n.deg)*0.85);
    if(n.isIndex) n.r = Math.max(n.r, 5.5);
  });

  if(mode==='cluster'){
    const areas=[...new Set(nodesPos.map(n=>n.top))];
    const total=nodesPos.length;
    let acc=-Math.PI/2;
    areas.forEach(a=>{
      const list=nodesPos.filter(n=>n.top===a);
      const span=(list.length/Math.max(total,1))*Math.PI*2;
      list.sort((x,y)=> x.dir.localeCompare(y.dir) || x.name.localeCompare(y.name));
      list.forEach((n,i)=>{
        const t=list.length===1?0.5:i/(list.length-1);
        const ang=acc+span*(0.06+0.88*t);
        const rad=240+n.depth*46;
        n.x=Math.cos(ang)*rad; n.y=Math.sin(ang)*rad*0.92;
      });
      acc+=span;
    });
    DATA.clusters = rebuildClusters();
    return;
  }

  /* --- 目录簇布局：目录 -> 簇内网格 -> 分区圆盘 -> 全局圆盘 --- */
  const byArea=new Map();
  nodesPos.forEach(n=>{
    const a=n.top||'(根)';
    if(!byArea.has(a)) byArea.set(a,new Map());
    const m=byArea.get(a);
    if(!m.has(n.dir)) m.set(n.dir,[]);
    m.get(n.dir).push(n);
  });

  // 1) 每个目录簇在局部坐标系铺开
  const clustersByArea=new Map();
  byArea.forEach((dirMap,area)=>{
    const cl=[];
    dirMap.forEach((list,dir)=>{
      const r=placeCluster(list);
      cl.push({dir, n:list.length, r, key:dir, nodes:list});
    });
    clustersByArea.set(area,cl);
  });

  // 2) 分区圆盘：把本区所有簇打包成一个盘
  const areas=[];
  clustersByArea.forEach((cl,area)=>{
    const R=packDiscs(cl, GAP_CL);
    areas.push({area, key:area, r:R, clusters:cl});
  });

  // 3) 全局：分区圆盘再打包
  const globalR=packDiscs(areas, GAP_AR);

  // 4) 回填坐标
  areas.forEach(a=>{
    a.clusters.forEach(c=>{
      c.nodes.forEach(nd=>{
        nd.x = a.px + c.px + nd._x;
        nd.y = a.py + c.py + nd._y;
      });
    });
  });
  DATA.clusters = rebuildClusters();
}

/* 用实际坐标重算簇标注（簇心 / 半径），供 drawClusterLabels 使用 */
function rebuildClusters(){
  const m=new Map();
  nodes.forEach(n=>{
    if(!m.has(n.dir)) m.set(n.dir,[]);
    m.get(n.dir).push(n);
  });
  const out=[];
  m.forEach((list,dir)=>{
    let cx=0,cy=0,r=0;
    list.forEach(n=>{ cx+=n.x; cy+=n.y; });
    cx/=list.length; cy/=list.length;
    list.forEach(n=>{ r=Math.max(r, Math.hypot(n.x-cx,n.y-cy)+n.r); });
    out.push({dir, n:list.length, x:cx, y:cy, r:r+4});
  });
  return out;
}

/* ---------------- 画布 ---------------- */
const cv = $('#cv'), ctx = cv.getContext('2d');
let view={k:1,tx:0,ty:0}, hover=null, sel=null, hubFilter=0;
let W=0,H=0,DPR=1;
function resize(){
  const b = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W=b.width; H=b.height;
  cv.width=W*DPR; cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  draw();
}
function visibleNodes(){
  let arr = nodes;
  if(!showProxy) arr = arr.filter(n=>!isProxy(n));
  if(hubFilter) arr = arr.filter(n=>n.deg>=hubFilter);
  if(focusArea) arr = arr.filter(n=>n.top===focusArea);
  return arr;
}
function visibleEdges(vset){
  return allEdges.filter(e=>typeState[e.type] && vset.has(e.s) && vset.has(e.t));
}
function fitView(){
  const arr=visibleNodes();
  if(!arr.length||!W) return;
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  arr.forEach(n=>{ minX=Math.min(minX,n.x); maxX=Math.max(maxX,n.x);
                   minY=Math.min(minY,n.y); maxY=Math.max(maxY,n.y); });
  const bw=Math.max(maxX-minX,60), bh=Math.max(maxY-minY,60);
  view.k=Math.max(.2, Math.min(1.35, Math.min((W-160)/bw,(H-140)/bh)));
  view.tx=(W-(minX+maxX)*view.k)/2;
  view.ty=(H-(minY+maxY)*view.k)/2;
}

function draw(){
  if(!W) return;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0a0e15'; ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W*0.42,H*0.42,40,W*0.5,H*0.5,Math.max(W,H)*0.72);
  g.addColorStop(0,'#111c2a'); g.addColorStop(1,'#0a0e15');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  const arr = visibleNodes();
  const vset = new Set(arr.map(n=>n.id));
  const edges = visibleEdges(vset);
  const focusId = hover||sel;
  const nb = new Set();
  if(focusId){
    nb.add(focusId);
    edges.forEach(e=>{ if(e.s===focusId) nb.add(e.t); if(e.t===focusId) nb.add(e.s); });
  }

  ctx.save();
  ctx.translate(view.tx,view.ty); ctx.scale(view.k,view.k);

  // 边
  for(const e of edges){
    const a=byId.get(e.s), b=byId.get(e.t);
    if(!a||!b) continue;
    const m=EDGE_META[e.type];
    const active = focusId && (e.s===focusId||e.t===focusId);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
    ctx.strokeStyle = m.color;
    let alpha = active? .95 : (e.type==='sibling'? .12 : e.type==='cross'? .14 :
                  e.type==='index'? .42 : .30);
    if(focusId) alpha = active? .95 : .07;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = (active? 2.1 : (e.type==='index'? .8 : .55))/view.k;
    ctx.setLineDash(m.dash.length? m.dash.map(x=>x/view.k) : []);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // 目录簇：淡色边界 + 目录名（缩放足够时）
  ctx.textAlign='center'; ctx.textBaseline='middle';
  DATA.clusters.forEach(c=>{
    const sx=c.x*view.k+view.tx, sy=c.y*view.k+view.ty;
    const r=c.r*view.k;
    if(sx<-r||sx>W+r||sy<-r||sy>H+r) return;
    const col=AREA_COLOR[(c.dir.split('/')[0])||'(根)']||'#7f93a8';
    if(c.n>=4 && r>26){
      ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
      ctx.strokeStyle=col; ctx.globalAlpha=.10; ctx.lineWidth=1/view.k; ctx.stroke();
    }
  });

  // 节点（小点先画，枢纽后画）
  const ordered = arr.slice().sort((a,b)=>a.deg-b.deg);
  for(const n of ordered){
    const isFocus = focusId===n.id;
    const dim = focusId && !nb.has(n.id);
    const col = AREA_COLOR[n.top]||'#94a3b8';
    ctx.globalAlpha = dim? .34 : 1;
    if(isProxy(n)){
      const d=n.r*1.25;
      ctx.beginPath(); ctx.moveTo(n.x,n.y-d); ctx.lineTo(n.x+d,n.y);
      ctx.lineTo(n.x,n.y+d); ctx.lineTo(n.x-d,n.y); ctx.closePath();
      ctx.strokeStyle=col; ctx.lineWidth=1.1/view.k; ctx.stroke();
      ctx.fillStyle='rgba(15,25,36,.9)'; ctx.fill();
      ctx.globalAlpha = (dim? .34 : 1)*.55; ctx.fillStyle=col; ctx.fill();
      ctx.globalAlpha = dim? .34 : 1;
    } else {
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
      ctx.fillStyle=col; ctx.fill();
      if(n.isIndex){ ctx.strokeStyle='#dfe9f8'; ctx.lineWidth=1.1/view.k; ctx.stroke(); }
    }
    if(isFocus || (focusId && nb.has(n.id))){
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r+4,0,Math.PI*2);
      ctx.strokeStyle = isFocus? '#ffffff' : col;
      ctx.globalAlpha = isFocus? .95 : .4;
      ctx.lineWidth = 1.1/view.k; ctx.stroke();
    }
    if(query && (n.name.toLowerCase().includes(query)||n.id.toLowerCase().includes(query))){
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r+5,0,Math.PI*2);
      ctx.strokeStyle='#ffffff'; ctx.globalAlpha=.9; ctx.lineWidth=1.3/view.k; ctx.stroke();
    }
  }
  ctx.restore();

  drawClusterLabels();
  drawAreaLabels(arr);

  // 标签：屏幕坐标绘制，恒定字号 + 贪心避让
  drawLabels(arr, focusId, nb);
  ctx.globalAlpha=1;
  $('#hud').textContent = `${arr.length} 节点 · ${fmt(edges.length)} 条链接`;
}

function drawClusterLabels(){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  DATA.clusters.forEach(c=>{
    if(!showProxy && c.dir.indexOf(PROXY_TOP)>=0) return;
    const r=c.r*view.k;
    if(r<17 || c.n<3) return;
    if(view.k<0.55 && c.n<8) return;
    const sx=c.x*view.k+view.tx, sy=c.y*view.k+view.ty;
    const ly = sy - r - 9;
    if(sx<-80||sx>W+80||ly<-16||ly>H+16) return;
    const nm=c.dir.split('/').pop();
    const txt=nm.length>14?nm.slice(0,13)+'…':nm;
    const fs = view.k<0.55? 9.5 : 11;
    ctx.font=`${fs}px "Microsoft YaHei",system-ui`;
    const w=ctx.measureText(txt).width;
    const col=AREA_COLOR[(c.dir.split('/')[0])||'(根)']||'#8fa3b8';
    // 胶囊底
    ctx.globalAlpha=1;
    ctx.beginPath();
    const bw=w+13, bh=16, bx=sx-bw/2, by=ly-bh/2, rr=4;
    ctx.moveTo(bx+rr,by); ctx.arcTo(bx+bw,by,bx+bw,by+bh,rr);
    ctx.arcTo(bx+bw,by+bh,bx,by+bh,rr); ctx.arcTo(bx,by+bh,bx,by,rr);
    ctx.arcTo(bx,by,bx+bw,by,rr); ctx.closePath();
    ctx.fillStyle='rgba(22,34,47,.92)'; ctx.fill();
    ctx.strokeStyle=col; ctx.globalAlpha=.55; ctx.lineWidth=1; ctx.stroke();
    ctx.globalAlpha=1; ctx.fillStyle='#dbe7f6';
    ctx.fillText(txt, sx, ly+0.5);
  });
}

function drawAreaLabels(arr){
  const buckets={};
  arr.forEach(n=>{ (buckets[n.top]=buckets[n.top]||[]).push(n); });
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.font='600 11px "Microsoft YaHei",system-ui';
  Object.entries(buckets).forEach(([area,list])=>{
    if(list.length<3) return;
    let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
    list.forEach(n=>{ minX=Math.min(minX,n.x);maxX=Math.max(maxX,n.x);
                      minY=Math.min(minY,n.y);maxY=Math.max(maxY,n.y); });
    const sx=(minX+maxX)/2*view.k+view.tx, sy=minY*view.k+view.ty-16;
    const col=AREA_COLOR[area]||'#94a3b8';
    const label = area==='(根)'? '根目录导航' : area;
    const txt=label;
    ctx.globalAlpha=1; ctx.lineWidth=3.5; ctx.strokeStyle='rgba(10,14,21,.92)';
    ctx.strokeText(txt, sx, sy);
    ctx.globalAlpha=.7; ctx.fillStyle=col; ctx.fillText(txt, sx, sy);
  });
}

function drawLabels(arr, focusId, nb, noBudget){
  const place = [];
  const cands = [];
  for(const n of arr){
    const isFocus = focusId===n.id;
    const isNb = focusId && nb.has(n.id);
    let show = isFocus || isNb;
    if(!show){
      if(labelMode==='all') show = true;
      else if(labelMode==='hub') show = n.deg>=(view.k<0.62? 64 : view.k<0.95? 34 : 12) || (n.isIndex && n.in>=14);
    }
    if(query && (n.name.toLowerCase().includes(query)||n.id.toLowerCase().includes(query))) show=true;
    if(!show) continue;
    cands.push({n, pri: isFocus?0 : n.id===sel?.id?1 : isNb?2 : (n.isIndex?3:4)});
  }
  cands.sort((a,b)=>a.pri-b.pri || b.n.deg-a.n.deg);
  const budget = view.k<0.5? 12 : view.k<0.75? 26 : view.k<1.1? 52 : 140;
  let placed=0;
  ctx.textBaseline='middle'; ctx.textAlign='left';
  for(const {n,pri} of cands){
    const sx=n.x*view.k+view.tx, sy=n.y*view.k+view.ty;
    if(sx<-40||sx>W+40||sy<-20||sy>H+20) continue;
    const dim = focusId && !nb.has(n.id) && n.id!==focusId;
    const label = n.name.length>30? n.name.slice(0,29)+'…' : n.name;
    ctx.font = `${n.isIndex?600:400} ${11.5}px "Microsoft YaHei",system-ui`;
    const w = ctx.measureText(label).width;
    const x = sx + Math.max(6, n.r*view.k+4), y = sy;
    const box = {x:x-3,y:y-7,w:w+7,h:14};
    const hit = place.some(b=> !(box.x>b.x+b.w || box.x+box.w<b.x || box.y>b.y+b.h || box.y+box.h<b.y));
    if(hit && pri>1) continue;           // 焦点与邻接标签强制显示
    if(placed>=budget && pri>1) continue;
    place.push(box); placed++;
    ctx.globalAlpha = dim? .22 : .95;
    ctx.lineWidth = 3; ctx.strokeStyle='rgba(10,14,21,.92)'; ctx.lineJoin='round';
    ctx.strokeText(label, x, y);
    ctx.fillStyle = n.id===focusId? '#ffffff' : (n.isIndex? '#e2ecfa':'#b9c9dc');
    ctx.fillText(label, x, y);
  }
}

/* 交互 */
let drag=null, moved=false;
function toWorld(px,py){ return {x:(px-view.tx)/view.k, y:(py-view.ty)/view.k}; }
function pick(px,py){
  const w=toWorld(px,py);
  let best=null, bd=1e9;
  const arr=visibleNodes();
  arr.forEach(n=>{
    const d=Math.hypot(n.x-w.x,n.y-w.y);
    const tol=Math.max(n.r+6/view.k, 9/view.k);
    if(d<tol && d<bd){bd=d;best=n;}
  });
  return best;
}
cv.addEventListener('mousemove',e=>{
  const b=cv.getBoundingClientRect();
  const px=e.clientX-b.left, py=e.clientY-b.top;
  if(drag){
    const dx=px-drag.px, dy=py-drag.py;
    if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
    view.tx+=dx; view.ty+=dy; drag={px,py}; cv.classList.add('dragging'); draw(); return;
  }
  const n=pick(px,py);
  if(hover!==n){ hover=n; cv.classList.toggle('pointing',!!n); draw(); }
  const tip=$('#tip');
  if(n){
    tip.style.opacity=1;
    tip.style.left=Math.min(px+16, W-350)+'px';
    tip.style.top=Math.min(py+14, H-110)+'px';
    const tags=n.tags.length? n.tags.slice(0,4).join(' · ') : '无标签';
    tip.innerHTML=`<div class="t">${n.name}</div><div class="p">${shortPath(n.path)}</div>
      <div class="m">${n.top+' · 入链 '+n.in+' / 出链 '+n.out}</div>
      <div class="m" style="color:#6f849c">${tags}</div>`;
  } else tip.style.opacity=0;
});
cv.addEventListener('mousedown',e=>{
  const b=cv.getBoundingClientRect(); moved=false;
  drag={px:e.clientX-b.left, py:e.clientY-b.top};
});
window.addEventListener('mouseup',e=>{
  if(drag && !moved){
    const b=cv.getBoundingClientRect();
    const n=pick(e.clientX-b.left, e.clientY-b.top);
    select(n);
  }
  drag=null; cv.classList.remove('dragging');
});
cv.addEventListener('mouseleave',()=>{hover=null; $('#tip').style.opacity=0; draw();});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const b=cv.getBoundingClientRect(), px=e.clientX-b.left, py=e.clientY-b.top;
  const k2=Math.min(5, Math.max(.18, view.k*(e.deltaY<0?1.12:.89)));
  view.tx = px-(px-view.tx)*(k2/view.k);
  view.ty = py-(py-view.ty)*(k2/view.k);
  view.k=k2; draw();
},{passive:false});

/* ---------------- 详情 ---------------- */
function areaBadge(n){ return `<span class="badge" style="color:${AREA_COLOR[n.top]};border-color:${AREA_COLOR[n.top]}55">${n.top==='(根)'?'根目录':n.top}</span>`; }
function select(n){
  sel=n;
  const d=$('#detail');
  if(!n){ d.innerHTML=overviewHTML(); bindDetail(); return; }
  const out=adjOut.get(n.id)||[], inn=adjIn.get(n.id)||[];
  const group = (arr, dir)=> {
    const m={};
    arr.forEach(e=>{ (m[e.type]=m[e.type]||[]).push(e[dir]); });
    return typeOrder.filter(k=>m[k]).map(k=>{
      const items=m[k].slice(0,14).map(id=>{
        const t=byId.get(id); if(!t) return '';
        return `<button class="lnk" data-goto="${id}">${t.name}<span class="tp">${EDGE_META[k].label}</span></button>`;
      }).join('');
      return `<div class="grp"><h4><span style="color:${EDGE_META[k].color}">●</span>${EDGE_META[k].label}
        <span class="ln" style="background:${EDGE_META[k].color}33"></span>${m[k].length}</h4>${items}
        ${m[k].length>14?`<div style="font-size:10px;color:#5b6f86;padding-left:9px">…另 ${m[k].length-14} 条</div>`:''}</div>`;
    }).join('');
  };
  d.innerHTML=`
    <h2 class="d-title">${n.title}</h2>
    <div class="d-path">${n.path}</div>
    <div class="badges">${areaBadge(n)}${n.isIndex?'<span class="badge">索引页</span>':''}${isProxy(n)?'<span class="badge">代码导航代理页</span>':''}
      ${n.tags.slice(0,6).map(t=>`<span class="badge tg">#${t}</span>`).join('')}</div>
    <div class="kv"><span>入链 / 出链</span><b>${n.in} / ${n.out}</b></div>
    <div class="kv"><span>总度数</span><b>${n.deg}</b></div>
    <div class="kv"><span>二级标题</span><b>${n.h2||0}</b></div>
    <div class="kv"><span>篇幅</span><b>${fmt(n.chars)} 字符</b></div>
    ${inn.length?`<div class="grp"><h4>被引用 <span class="ln"></span>${inn.length}</h4>
      ${group(inn,'s')}</div>`:''}
    ${out.length?`<div class="grp"><h4>引用他处 <span class="ln"></span>${out.length}</h4>
      ${group(out,'t')}</div>`:''}
    ${!inn.length&&!out.length?'<div class="empty" style="margin-top:14px">孤立笔记：无入链也无出链。</div>':''}
    <div style="display:flex;gap:6px;margin-top:18px">
      <button class="mini" data-jump-graph style="flex:1">在图谱中定位</button>
      <button class="mini" data-jump-mind style="flex:1">在导图中定位</button>
    </div>
    <button class="mini" data-back style="width:100%;margin-top:6px">← 返回总览</button>
  `;
  bindDetail();
  if(currentView==='mind'){ renderMind(); drawRelArcs(n); }
  draw();
}
function bindDetail(){
  document.querySelectorAll('#detail [data-goto]').forEach(b=>{
    b.onclick=()=>{ const n=byId.get(b.dataset.goto); if(n){ select(n); revealInMind(n);} };
  });
  const back=document.querySelector('#detail [data-back]');
  if(back) back.onclick=()=>select(null);
  const jg=document.querySelector('#detail [data-jump-graph]');
  if(jg && sel) jg.onclick=()=>{
    if(currentView!=='graph') switchView('graph');
    const wrap=cv.getBoundingClientRect();
    view.k=1.05; view.tx=wrap.width/2 - sel.x*view.k; view.ty=wrap.height/2 - sel.y*view.k;
    draw();
  };
  const jm=document.querySelector('#detail [data-jump-mind]');
  if(jm && sel) jm.onclick=()=>{ if(currentView!=='mind') switchView('mind'); revealInMind(sel); };
}
function overviewHTML(){
  const hubs = DATA.hubs.slice(0,10).map(h=>{
    const n=byId.get(h.id);
    return `<button class="lnk" data-goto="${h.id}">${n?n.name:h.id.split('/').pop()}<span class="tp">deg ${h.deg}</span></button>`;
  }).join('');
  const tags = DATA.topTags.slice(0,12).map(([t,c])=>
    `<div class="kv" style="border:0;padding:3px 0"><span>#${t}</span><b>${c}</b></div>`).join('');
  const mx = DATA.matrix.filter(m=>m.s!==m.t).slice(0,6).map(m=>
    `<div class="kv" style="border:0;padding:3px 0"><span>${m.s==='(根)'?'根':m.s} → ${m.t==='(根)'?'根':m.t}</span><b>${m.n}</b></div>`).join('');
  return `
    <div class="empty" style="margin-bottom:14px">
      <b>项目笔记架构总览</b>
      ${DATA.stats.notes} 篇笔记分布在 ${DATA.stats.topCounts.filter(t=>t[0]!=='(根)').length} 个编号分区：
      ${DATA.stats.topCounts.map(([k,v])=>`${k==='(根)'?'根入口':k.replace(/^\d+-/,'')}（${v}）`).join('、')}。
      代码工作区（<code>stages/</code>、<code>deploy/</code>、<code>artifacts/</code>）位于 Vault 之外，由第 06 分区的代理页单向指回。
    </div>
    <div class="grp"><h4>枢纽笔记 TOP10<span class="ln"></span></h4>${hubs}</div>
    <div class="grp"><h4>高频标签<span class="ln"></span></h4>${tags}</div>
    <div class="grp"><h4>跨分区引用强度<span class="ln"></span></h4>${mx}</div>
  `;
}

/* ---------------- 思维导图 ---------------- */
const svg=$('#msvg'), mroot=$('#mroot');
let mindState={}, mindTf={k:1,x:60,y:60}, currentView='graph', collapsed=new Set();
const ROW=21, COL=238;

function buildMindTree(){
  const t=DATA.tree;
  function norm(node, depth, parentPath){
    const o={name:node.name, kind:node.type, path:node.path, count:node.count||0,
      id:node.id, depth, area:null, children:[], tags:node.tags||[], deg:node.deg||0, isIndex:node.isIndex};
    if(node.type==='dir'){
      o.children=(node.children||[]).map(c=>norm(c, depth+1, node.path));
    }
    return o;
  }
  const root=norm(t,0,'');
  // 计算每个节点的分区
  root.area='(根)';
  (function walk(n, area){
    n.children.forEach(c=>{
      const a = n.depth===0 ? c.name : area;
      c.area = n.depth===0 ? (c.name==='README.md'?'(根)':c.name) : area;
      walk(c, c.area);
    });
  })(root, '(根)');
  return root;
}
const MROOT = buildMindTree();

function defaultFold(){
  collapsed=new Set();
  (function walk(n){
    n.children.forEach(c=>{
      if(c.kind==='dir' && (c.depth>=2 || c.name.indexOf('06-')===0)) collapsed.add(c.path);
      walk(c);
    });
  })(MROOT);
}
defaultFold();

function mindVisible(){
  const rows=[];
  function walk(n){
    rows.push(n);
    if(n.kind==='dir' && !collapsed.has(n.path)) n.children.forEach(walk);
  }
  walk(MROOT);
  return rows;
}
function layoutMind(){
  let cur=0;
  const rows=mindVisible();
  function place(n){
    const kids = (n.kind==='dir' && !collapsed.has(n.path))? n.children : [];
    if(!kids.length){ n.y=cur*ROW; cur++; }
    else { kids.forEach(place); n.y=(kids[0].y+kids[kids.length-1].y)/2; }
    n.x = n.depth*COL;
  }
  place(MROOT);
  // 同列强制最小行距，避免同名文件与同名目录重叠
  const byDepth={};
  rows.forEach(n=>{ (byDepth[n.depth]=byDepth[n.depth]||[]).push(n); });
  Object.values(byDepth).forEach(list=>{
    list.sort((a,b)=>a.y-b.y);
    for(let i=1;i<list.length;i++){
      if(list[i].y-list[i-1].y < ROW) list[i].y=list[i-1].y+ROW;
    }
  });
  let maxY=0; rows.forEach(n=>{ maxY=Math.max(maxY,n.y); });
  return {rows, height:Math.max(maxY+ROW, ROW)};
}
function renderMind(){
  const {rows, height}=layoutMind();
  const NS='http://www.w3.org/2000/svg';
  while(mroot.firstChild) mroot.removeChild(mroot.firstChild);
  // 连线
  rows.forEach(n=>{
    if(n.kind!=='dir'||collapsed.has(n.path)) return;
    n.children.forEach(c=>{
      const p=document.createElementNS(NS,'path');
      const mid=(n.x+34+c.x-10)/2;
      p.setAttribute('d',`M${n.x+8},${n.y} C${mid},${n.y} ${mid},${c.y} ${c.x-10},${c.y}`);
      p.setAttribute('fill','none');
      p.setAttribute('stroke', c.kind==='dir'?'#243447':(AREA_COLOR[c.area]||'#3b4d63'));
      p.setAttribute('stroke-opacity', c.kind==='dir'?'.9':'.38');
      p.setAttribute('stroke-width','1');
      p.setAttribute('data-link','1');
      mroot.appendChild(p);
    });
  });
  // 节点
  rows.forEach(n=>{
    const g=document.createElementNS(NS,'g');
    g.setAttribute('class','m-node');
    const col=AREA_COLOR[n.area]||'#94a3b8';
    if(n.kind==='dir'){
      const r=document.createElementNS(NS,'rect');
      r.setAttribute('x',n.x-9); r.setAttribute('y',n.y-7);
      r.setAttribute('width','18'); r.setAttribute('height','14'); r.setAttribute('rx','4');
      r.setAttribute('fill', collapsed.has(n.path)? '#131f2d':'#182a3f');
      r.setAttribute('stroke', col); r.setAttribute('stroke-opacity','.55');
      g.appendChild(r);
      const t=document.createElementNS(NS,'text');
      t.setAttribute('x',n.x+16); t.setAttribute('y',n.y);
      t.setAttribute('class','m-lbl dir');
      const dn=n.name.length>19? n.name.slice(0,18)+'…' : n.name;
      t.textContent=(collapsed.has(n.path)?'▸ ':'▾ ')+dn;
      const tip=document.createElementNS(NS,'title'); tip.textContent=n.path; t.appendChild(tip);
      g.appendChild(t);
      const c=document.createElementNS(NS,'text');
      c.setAttribute('x',n.x+17+Math.min(n.name.length,19)*11.4); c.setAttribute('y',n.y+1);
      c.setAttribute('class','m-cnt'); c.textContent=n.count? '· '+n.count:'';
      g.appendChild(c);
    } else {
      const circle=document.createElementNS(NS,'circle');
      const rr=Math.min(6.5, 2.6+Math.sqrt(n.deg)*.75);
      circle.setAttribute('cx',n.x); circle.setAttribute('cy',n.y); circle.setAttribute('r',rr);
      circle.setAttribute('fill', n.isIndex?'#0d1520':col);
      circle.setAttribute('stroke', n.isIndex? col : 'none');
      circle.setAttribute('stroke-width', n.isIndex?'1.6':'0');
      g.appendChild(circle);
      const t=document.createElementNS(NS,'text');
      t.setAttribute('x',n.x+11); t.setAttribute('y',n.y+0.5);
      t.setAttribute('class','m-lbl');
      t.setAttribute('fill', n.isIndex? '#dbe7f7':'#a9bacd');
      if(n.isIndex) t.setAttribute('font-weight','600');
      const nm=n.name.length>30? n.name.slice(0,29)+'…' : n.name;
      t.textContent=nm;
      const tip2=document.createElementNS(NS,'title'); tip2.textContent=n.path; t.appendChild(tip2);
      g.appendChild(t);
      if(sel && sel.id===n.id){
        const h=document.createElementNS(NS,'circle');
        h.setAttribute('cx',n.x); h.setAttribute('cy',n.y); h.setAttribute('r',rr+4);
        h.setAttribute('fill','none'); h.setAttribute('stroke','#fff'); h.setAttribute('stroke-width','1.4');
        g.appendChild(h);
      }
    }
    if(n.kind==='dir' && n.children.length) g.style.cursor='pointer';
    g.addEventListener('click',ev=>{
      ev.stopPropagation();
      if(n.kind==='dir'){
        if(collapsed.has(n.path)) collapsed.delete(n.path); else collapsed.add(n.path);
        renderMind();
      } else {
        const note = noteById.get(n.path);
        if(note) select(note);
      }
    });
    const title=document.createElementNS(NS,'title');
    title.textContent = n.kind==='dir'? `${n.name}（${n.count} 篇）` : `${n.path}`;
    g.appendChild(title);
    mroot.appendChild(g);
  });
  mroot.setAttribute('transform',`translate(${mindTf.x},${mindTf.y}) scale(${mindTf.k})`);
  if(sel) drawRelArcs(sel);
  $('#mlegend').innerHTML = Object.entries(AREA_COLOR).map(([k,v])=>
    `<span><i class="dot" style="background:${v}"></i>${k==='(根)'?'根目录':k}</span>`).join('')+
    `<span style="color:#5f748c">○ 索引页 · 圆点=连接度 · 数字=目录内笔记数</span>
     <span style="color:#a78bfa">弧线＝选中笔记的引用关系（颜色对应链接类型）</span>`;
}
function drawRelArcs(n){
  mroot.querySelectorAll('[data-rel]').forEach(e=>e.remove());
  if(!n) return;
  const rows=mindVisible();
  const pos=new Map();
  rows.forEach(r=>{ if(r.kind==='note') pos.set(r.path,r); });
  const src=pos.get(n.id); if(!src) return;
  (adjAll.get(n.id)||[]).forEach(e=>{
    const otherId = e.s===n.id? e.t : e.s;
    const o=pos.get(otherId); if(!o) return;
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    const mx=(src.x+o.x)/2, my=(src.y+o.y)/2 - Math.min(160, Math.abs(o.y-src.y)*.42+20);
    p.setAttribute('d',`M${src.x+4},${src.y} Q${mx},${my} ${o.x+4},${o.y}`);
    p.setAttribute('fill','none');
    p.setAttribute('stroke', EDGE_META[e.type].color);
    p.setAttribute('stroke-opacity','.55'); p.setAttribute('stroke-width','1.1');
    if(EDGE_META[e.type].dash.length) p.setAttribute('stroke-dasharray','4 4');
    p.setAttribute('data-rel','1');
    mroot.insertBefore(p, mroot.firstChild);
  });
}
function revealInMind(n){
  // 展开所有祖先目录
  const parts=n.id.split('/');
  let p='';
  for(let i=0;i<parts.length-1;i++){
    p = p? p+'/'+parts[i] : parts[i];
    collapsed.delete(p);
  }
  renderMind();
  const rows=mindVisible().find(r=>r.path===n.id);
  if(rows){
    const wrap=$('#mindwrap').getBoundingClientRect();
    mindTf.x = wrap.width*0.42 - rows.x*mindTf.k;
    mindTf.y = wrap.height*0.45 - rows.y*mindTf.k;
    mroot.setAttribute('transform',`translate(${mindTf.x},${mindTf.y}) scale(${mindTf.k})`);
  }
}
function mindFit(){
  const rows=mindVisible();
  if(!rows.length) return;
  const maxX=Math.max(...rows.map(r=>r.x+ (r.kind==='dir'? 220+r.name.length*12 : r.name.length*7+30)));
  const minY=Math.min(...rows.map(r=>r.y)), maxY=Math.max(...rows.map(r=>r.y));
  const wrap=$('#mindwrap').getBoundingClientRect();
  const k=Math.min(1.45, Math.min((wrap.width-90)/maxX, (wrap.height-120)/(maxY-minY+40)));
  mindTf.k=Math.max(.42,k);
  const contentW=maxX* mindTf.k;
  mindTf.x=Math.max(40,(wrap.width-contentW)/2);
  mindTf.y=70-minY*mindTf.k;
  mroot.setAttribute('transform',`translate(${mindTf.x},${mindTf.y}) scale(${mindTf.k})`);
}

/* mind 拖拽缩放 */
let mdrag=null;
$('#mindwrap').addEventListener('mousedown',e=>{
  if(e.target.closest('.mindbar')) return;
  mdrag={x:e.clientX,y:e.clientY,ox:mindTf.x,oy:mindTf.y};
  $('#mindwrap').classList.add('dragging');
});
window.addEventListener('mousemove',e=>{
  if(!mdrag) return;
  mindTf.x=mdrag.ox+(e.clientX-mdrag.x); mindTf.y=mdrag.oy+(e.clientY-mdrag.y);
  mroot.setAttribute('transform',`translate(${mindTf.x},${mindTf.y}) scale(${mindTf.k})`);
});
window.addEventListener('mouseup',()=>{mdrag=null; $('#mindwrap').classList.remove('dragging');});
$('#mindwrap').addEventListener('wheel',e=>{
  e.preventDefault();
  const r=$('#mindwrap').getBoundingClientRect();
  const px=e.clientX-r.left, py=e.clientY-r.top;
  const k2=Math.min(2.2,Math.max(.18,mindTf.k*(e.deltaY<0?1.1:.91)));
  mindTf.x=px-(px-mindTf.x)*(k2/mindTf.k);
  mindTf.y=py-(py-mindTf.y)*(k2/mindTf.k);
  mindTf.k=k2;
  mroot.setAttribute('transform',`translate(${mindTf.x},${mindTf.y}) scale(${mindTf.k})`);
},{passive:false});

document.querySelectorAll('[data-exp]').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('[data-exp]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const lv=+b.dataset.exp;
    collapsed=new Set();
    (function walk(n){
      n.children.forEach(c=>{ if(c.kind==='dir' && c.depth>=lv) collapsed.add(c.path); walk(c); });
    })(MROOT);
    renderMind(); mindFit();
  };
});
$('#mfit').onclick=mindFit;
$('#mrel').onclick=()=>{
  if(!sel){ alert('先点击一篇笔记'); return; }
  const ids=new Set();
  (adjAll.get(sel.id)||[]).forEach(e=>ids.add(e.s===sel.id? e.t : e.s));
  ids.forEach(id=>{
    const parts=id.split('/'); let p='';
    for(let i=0;i<parts.length-1;i++){ p=p? p+'/'+parts[i] : parts[i]; collapsed.delete(p); }
  });
  renderMind(); revealInMind(sel);
};
$('#mfold').onclick=()=>{
  collapsed=new Set();
  MROOT.children.forEach(c=>{ if(c.kind==='dir') collapsed.add(c.path); });
  renderMind(); mindFit();
};

/* ---------------- 视图切换 ---------------- */
function switchView(v){
  currentView=v;
  $('#tab-graph').classList.toggle('active',v==='graph');
  $('#tab-mind').classList.toggle('active',v==='mind');
  $('#view-graph').classList.toggle('active',v==='graph');
  $('#view-mind').classList.toggle('active',v==='mind');
  $('#side-graph').style.display = v==='graph'?'block':'none';
  if(v==='graph'){ resize(); }
  else { renderMind(); setTimeout(mindFit,30); }
}
$('#tab-graph').onclick=()=>switchView('graph');
$('#tab-mind').onclick=()=>switchView('mind');

/* ---------------- 启动 ---------------- */
buildLayout('force');
select(null);
resize();
fitView(); draw();
window.addEventListener('resize',()=>{ if(currentView==='graph') resize(); });
</script>
