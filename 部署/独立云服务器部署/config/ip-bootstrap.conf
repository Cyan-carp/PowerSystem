# Temporary HTTP-only site for first IP HTTP-01 issuance; replace with ip-https.conf.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 8.138.42.212;
    location ^~ /.well-known/acme-challenge/ {
        if ($host != '8.138.42.212') { return 421; }
        root /var/www/powersystem-acme;
        try_files $uri =404;
    }
    location / { return 421; }
}
