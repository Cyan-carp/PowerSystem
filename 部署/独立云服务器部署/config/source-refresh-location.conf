# Include in the existing IP HTTPS server only, before the generic location /.
# Requires http_realip_module. $realip_remote_addr is the original TCP peer.
location ^~ /_ops/frp-source/v1/ {
    limit_except POST { deny all; }
    limit_req zone=powersystem_source_rate burst=4 nodelay;
    limit_req_status 429;
    limit_conn powersystem_source_conn 2;
    client_max_body_size 2k;
    client_body_timeout 5s;
    access_log off;
    proxy_pass http://unix:/run/powersystem-source-web/http.sock;
    proxy_http_version 1.0;
    proxy_set_header Connection close;
    proxy_set_header X-Powersystem-Source $realip_remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 90s;
    proxy_buffering off;
    proxy_hide_header Server;
    add_header Cache-Control no-store always;
}
