# Cloud host only: terminate TLS for the existing FRP web proxy.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 8.138.10.222;

    ssl_certificate /etc/letsencrypt/live/8.138.10.222/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.138.10.222/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3667;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
