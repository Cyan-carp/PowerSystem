route:
  receiver: feishu
  group_by: [alertname]
  group_wait: 5s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - receiver: feishu-expiry
      matchers:
        - 'alertname=~"PowerSystemInboxExpiry.*"'
      repeat_interval: 30m
receivers:
  - name: feishu
    webhook_configs:
      - url: http://feishu-adapter:8091/alertmanager
        send_resolved: true
  - name: feishu-expiry
    webhook_configs:
      - url: http://feishu-adapter:8091/alertmanager
        send_resolved: false
