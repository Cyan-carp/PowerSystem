# Local Agent only. Existing Go API and Redis stay on the host loopback.
name: powersystem-stage7
services:
  agent:
    build: .
    ports: ["127.0.0.1:8092:8092"]
    environment:
      AGENT_BACKEND_URL: http://host.docker.internal:8080
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL}
      AGENT_LLM_API_KEY_FILE: /run/secrets/agent_llm_key
      AGENT_SERVICE_TOKEN_FILE: /run/secrets/agent_service_token
      AGENT_REDIS_URL: ${AGENT_REDIS_URL}
      AGENT_AUDIT_DIR: /audit
      AGENT_MISSES_DIR: /knowledge-misses
    secrets: [agent_llm_key, agent_service_token]
    volumes: ["../../artifacts/stage7/container-audit:/audit", "../../artifacts/stage7/v2m3/knowledge-misses:/knowledge-misses"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
secrets:
  agent_llm_key:
    file: ${AGENT_LLM_API_KEY_FILE:?set key file or empty local Ollama key file}
  agent_service_token:
    file: ${AGENT_SERVICE_TOKEN_FILE:?set service token file}
