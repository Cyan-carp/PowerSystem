route:
  receiver: feishu
  group_by: [alertname]
  group_wait: 5s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - receiver: agent
      matchers:
        - 'alertname=~"PowerSystemAPIDown|PowerSystemDiskHigh"'
      continue: true
    - receiver: feishu
receivers:
  - name: feishu
    webhook_configs:
      - url: http://feishu-adapter:8091/alertmanager
        send_resolved: true
  - name: agent
    webhook_configs:
      - url: http://agent:8092/internal/agent/monitor-events
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/agent_monitor_token
