# Enable only after the trusted IP certificate exists. Remove distribution default site.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 8.138.42.212;
    location ^~ /.well-known/acme-challenge/ {
        if ($host != '8.138.42.212') { return 421; }
        root /var/www/powersystem-acme;
        try_files $uri =404;
    }
    location / {
        if ($host != '8.138.42.212') { return 421; }
        return 301 https://8.138.42.212$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 8.138.42.212;
    ssl_certificate /etc/letsencrypt/live/8.138.42.212/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.138.42.212/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    if ($host != '8.138.42.212') { return 421; }
    location / {
        proxy_pass http://127.0.0.1:3667;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
